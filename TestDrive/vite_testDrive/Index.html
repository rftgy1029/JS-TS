<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountApp</title>
</head>
<body>
    
    <h1>버튼을 눌러라</h1>

    <h2 id="countNum">0</h2>

    <button id="increaseBtn">올리기!</button>
    <button id="decreaseBtn">줄이기</button>

    
    <script>
        const countBtn = document.querySelector("#increaseBtn");
        const countNum = document.querySelector("#countNum");
        const downcountBtn = document.querySelector("#decreaseBtn");

        let count = 0;

        countBtn.addEventListener("click", () => {
            count = count + 1;
            countNum.textContent = count;
        })

        downcountBtn.addEventListener("click", () => {
            if (count === 0) {
                alert("0보다 작게는 안됨")
            } else {
                count = count - 1;
                countNum.textContent = count;
            }
        })
    </script>
</body>
</html>
